# Overrides for local development on top of application.yml
spring:
  opensearch:
    compression-enabled: false
  docker:
    compose:
      enabled: true
      file: ./docker/infra-docker-compose.yml

folio:
  search-config:
    indexing:
      data-format: ${INDEXING_DATA_FORMAT:json}
  reindex:
    reindex-type: ${REINDEX_TYPE:EXPORT}
    merge-range-publisher-core-pool-size: ${REINDEX_MERGE_RANGE_PUBLISHER_CORE_POOL_SIZE:3}
    merge-range-publisher-max-pool-size: ${REINDEX_MERGE_RANGE_PUBLISHER_MAX_POOL_SIZE:6}
  kafka:
    listener:
      reindex-range-index:
        concurrency: ${KAFKA_REINDEX_RANGE_INDEX_CONCURRENCY:2}
      reindex-records:
        concurrency: ${KAFKA_REINDEX_RECORDS_CONCURRENCY:2}
      reindex-file-ready:
        concurrency: ${KAFKA_REINDEX_FILE_READY_CONCURRENCY:2}
  logging:
    request:
      level: full
    exchange:
      enabled: true
      level: full

logging:
  level:
    org.folio.spring.filter.IncomingRequestLoggingFilter: debug
    org.folio.spring.client.ExchangeLoggingInterceptor: debug
    org.opensearch.client: trace
    tracer: trace
