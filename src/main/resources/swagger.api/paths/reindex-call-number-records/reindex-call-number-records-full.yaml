post:
  operationId: reindexCallNumberRecords
  summary: Call Number Records Reindex
  description: Rebuilds the call number index from the item index, or recomputes call numbers of a single consortium tenant
  tags:
    - index-rebuild
  parameters:
    - $ref: '../../parameters/x-okapi-tenant-header.yaml'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../../schemas/request/indexRebuildRequest.yaml'
  responses:
    '200':
      description: Call number records reindex has been started
    '400':
      $ref: '../../responses/badRequestResponse.yaml'
    '500':
      $ref: '../../responses/internalServerErrorResponse.yaml'
