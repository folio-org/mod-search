description: "Item record returned by the item search"
type: object
properties:
  id:
    type: string
    description: "Unique ID of the item record"
  tenantId:
    description: "Tenant ID"
    type: string
  holdingsRecordId:
    description: "Holdings record ID"
    type: string
  instanceId:
    description: "Instance ID"
    type: string
  instanceTitle:
    description: "Title of the instance the item belongs to (resolved from the instance index, not stored in the item index)"
    type: string
  hrid:
    type: string
    description: "The human readable ID, also called eye readable ID. A system-assigned sequential alternate ID"
  accessionNumber:
    type: string
    description: "Also called inventory number"
  formerIds:
    type: array
    description: "Previous identifiers assigned to the item"
    items:
      type: string
  itemIdentifier:
    type: string
    description: "Item identifier number, e.g. imported from the union catalogue (read only)."
  barcode:
    type: string
    description: "Unique inventory control number for physical resources, used largely for circulation purposes"
  effectiveLocationId:
    type: string
    description: "Read only current home location for the item."
  statusName:
    type: string
    description: "Name of the item status e.g. Available, Checked out, In transit"
  materialTypeId:
    type: string
    description: "Material type, term. Define what type of thing the item is."
  permanentLoanTypeId:
    type: string
    description: "The permanent loan type, is the default loan type for a given item."
  temporaryLoanTypeId:
    type: string
    description: "Temporary loan type, is the loan type for a given item that overrides the permanent loan type."
  discoverySuppress:
    type: boolean
    description: "Records the fact that the record should not be displayed in a discovery system"
  callNumber:
    type: string
    description: "Effective Call Number is an identifier assigned to an item or its holding and associated with the item."
  callNumberPrefix:
    type: string
    description: "Effective Call Number Prefix is the prefix of the identifier assigned to an item or its holding and associated with the item."
  callNumberSuffix:
    type: string
    description: "Effective Call Number Suffix is the suffix of the identifier assigned to an item or its holding and associated with the item."
  callNumberTypeId:
    type: string
    description: "Effective Call Number Type Id is the call number type id of the item, if available, otherwise that of the holding."
  volume:
    type: string
  enumeration:
    type: string
  chronology:
    type: string
  copyNumber:
    type: string
  itemLevelCallNumberTypeId:
    type: string
    description: "Call number type id"
  tags:
    $ref: "../dto/common/tags.yaml"
  electronicAccess:
    type: array
    description: "List of electronic access items"
    items:
      $ref: "../dto/instance/electronicAccess.yaml"
  administrativeNotes:
    type: array
    description: "Administrative notes"
    items:
      type: string
  notes:
    type: array
    description: "Notes about action, copy, binding etc."
    items:
      $ref: "../dto/instance/note.yaml"
  statisticalCodeIds:
    type: array
    description: "List of statistical code IDs"
    items:
      type: string
      description: "UUID for a statistical code"
  circulationNotes:
    type: array
    description: "Notes to be displayed in circulation processes."
    items:
      $ref: "../dto/instance/circulationNote.yaml"
  metadata:
    $ref: "../dto/common/metadata.yaml"
