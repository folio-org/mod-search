# Test overrides on top of src/main/resources/application.yml (classpath:/config/ takes precedence over classpath:/)
spring:
  main:
    banner-mode: off
  opensearch:
    username: elastic
    password: s3cret
    compression-enabled: false
  datasource:
    username: folio_admin
    password: password

folio:
  environment: folio-test
  search-config:
    initial-languages: eng,fre,ita,spa,ger
    max-search-batch-request-ids-count: 500
    search-features:
      search-all-fields: false
      browse-contributors: false
      browse-subjects: false
      browse-classifications: false
      browse-call-numbers: false
    indexing:
      data-format: json
      instance-children-index-enabled: false
      item-index-enabled: false
      instance-children-index-delay-ms: 1000
      sub-resource-batch-size: 40
  reindex:
    reindex-type: PUBLISH
    location-batch-size: 2
  kafka:
    retry-interval-ms: 100
    retry-delivery-attempts: 2
    topics:
      - name: inventory.instance
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.item
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.holdings-record
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.bound-with
        numPartitions: 1
        replicationFactor: 1
      - name: authorities.authority
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.classification-type
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.call-number-type
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.location
        numPartitions: 1
        replicationFactor: 1
      - name: linked-data.authority
        numPartitions: 1
        replicationFactor: 1
      - name: linked-data.work
        numPartitions: 1
        replicationFactor: 1
      - name: linked-data.hub
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.campus
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.institution
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.library
        numPartitions: 1
        replicationFactor: 1
      - name: search.reindex.range-index
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.reindex-records
        numPartitions: 1
        replicationFactor: 1
      - name: inventory.reindex.file-ready
        numPartitions: 1
        replicationFactor: 1
      - name: search.index.instance
        numPartitions: 1
        replicationFactor: 1
      - name: CONSORTIUM_INSTANCE_SHARING_COMPLETE
        numPartitions: 1
        replicationFactor: 1
    listener:
      events:
        concurrency: 1
        max-poll-records: 5
        max-poll-interval-ms: 6000
      instances:
        concurrency: 1
      authorities:
        concurrency: 1
      browse-config-data:
        concurrency: 1
      location:
        concurrency: 1
      linked-data:
        concurrency: 1
      instance-sharing-complete:
        concurrency: 1
        topic-pattern: (${folio.environment}\.)(.*\.)CONSORTIUM_INSTANCE_SHARING_COMPLETE
      reindex-range-index:
        concurrency: 1
      reindex-records:
        concurrency: 1
      reindex-file-ready:
        concurrency: 1
      index-instance:
        concurrency: 1
        max-poll-records: 5
        max-poll-interval-ms: 6000
  okapiUrl: ${okapi.url}
  logging:
    exchange:
      enabled: true

logging:
  level:
    org.folio.spring.config.*: debug
    org.folio.spring.client.ExchangeLoggingInterceptor: debug
    org.opensearch.client: trace
    tracer: trace
